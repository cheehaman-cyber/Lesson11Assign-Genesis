<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/ad4071b035.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../styles/normalize.css">
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <header>
        <a href="../index.html"><img src="../images/Logo.svg" alt="Genesis home"></a>
        <nav aria-label="Main navigation">
            <a href="project.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <!-- Open the contact section -->
        <section class="contact-intro">
        <!-- Heading and introduction box -->
            <div class="contact-description">
                <h1>Full set of great features to make your product fresh</h1>

                <p>Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.</p>
            </div> <!-- Close the description box -->

            <!-- Open the contact form -->
            <form class="contact-form">
                <!-- Name field -->
                <div class="form-field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <!-- Email field -->
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <!-- Message field -->
                <div class="form-field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="3" required></textarea>
                </div>

                <!-- Submit button -->
                <button type="submit">Submit</button>
            </form> <!-- Close the contact form -->
        </section> <!-- Close the contact section -->
        
            <!-- Map below the introduction and form -->
        <iframe
            class="contact-map"
            title="Map of Broadway Triangle"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3024.6976952270793!2d-73.94871712348248!3d40.70265508818681!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25bfae0c4ffa1%3A0x4ca1a0fe1d8507a7!2sBroadway%20Triangle%2C%20Brooklyn%2C%20NY%2011206%2C%20USA!5e0!3m2!1sen!2sse!4v1791491311612!5m2!1sen!2sse"
            width="600"
            height="450"
            style="border: 0;"
            allowfullscreen
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
    </main>

    <footer>
        <a href="../index.html">Genesis</a>

        <nav aria-label="Footer navigation">
            <a href="project.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
        
        <!-- Box for the three social icons -->
        <div class="social-icons">
            <a href="https://dribbble.com/" aria-label="Dribbble"><i class="fa-brands fa-dribbble" aria-hidden="true"></i></a>
            <a href="https://www.instagram.com/" aria-label="Instagram"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
            <a href="https://twitter.com/" aria-label="Twitter"><i class="fa-brands fa-twitter" aria-hidden="true"></i></a>
        </div>
    </footer>
</body>
</html>
