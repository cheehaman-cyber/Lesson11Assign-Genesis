<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header>
        <a href="index.html"><img src="images/Logo.svg" alt="Genesis home"></a>
        <nav aria-label="Main navigation">
            <a href="project.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <!-- Open the contact section -->
        <section class="contact-intro">
        <!-- Heading and introduction box -->
            <div class="contact-description">
                <h1>Full set of great<br>features to make your<br>product fresh</h1>

                <p>Our favorite brands are our friends! We help them to<br>achieve their goals, they help us to stay sharp.</p>
            </div> <!-- Close the description box -->

            <!-- Open the contact form -->
            <form class="contact-form">
                <!-- Name field -->
                <div class="form-field">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <!-- Email field -->
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <!-- Message field -->
                <div class="form-field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="3" required></textarea>
                </div>

                <!-- Submit button -->
                <button type="submit">Submit</button>
            </form> <!-- Close the contact form -->
        </section> <!-- Close the contact section -->
        
            <!-- Map below the introduction and form -->
        <img class="contact-map" src="images/contact-map.jpg" alt="Map showing Broadway Triangle and the surrounding Brooklyn neighbourhood">
    </main> 

    <footer>
        <a href="index.html">Genesis</a>

        <nav aria-label="Footer navigation">
            <a href="project.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
        
        <!-- Box for the three social icons -->
        <div class="social-icons">
            <img src="images/social-01.svg" alt="Social icon 1">
            <img src="images/social-02.svg" alt="Social icon 2">
            <img src="images/social-03.svg" alt="Social icon 3">
        </div>
    </footer>
</body>
</html>
